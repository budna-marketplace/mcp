name: release

on:
  release:
    types: [released]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/core.yml
    with:
      ref: ${{ github.event.release.tag_name }}
      release: true

  cargo:
    needs: verify
    environment: cargo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4e529fb27e59237866a6523e61ab248308c068b4
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18
        id: auth
      - uses: katyo/publish-crates@02cc2f1ad653fb25c7d1ff9eb590a8a50d06186b
        with:
          registry-token: ${{ steps.auth.outputs.token }}
          args: --locked

  brew:
    needs: verify
    environment: brew
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: mislav/bump-homebrew-formula-action@f865c8b0dbebd6e263cc06782a0e974c61cf12d2
        with:
          formula-name: budna-mcp
          homebrew-tap: budna-marketplace/homebrew-tap
          push-to: budna-marketplace/homebrew-tap
          download-url: https://github.com/budna-marketplace/mcp.git
          tag-name: ${{ github.event.release.tag_name }}
          create-pullrequest: false
          create-branch: false
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COMMITTER_TOKEN: ${{ secrets.HOMEBREW_TOKEN }}

  npm:
    needs: verify
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - name: Download release package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern budna-mcp.tgz
          gh release verify-asset "$RELEASE_TAG" budna-mcp.tgz --repo "$GITHUB_REPOSITORY"
      - name: Exercise release package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          npm install --prefix "$RUNNER_TEMP/npm-smoke" --no-audit --no-fund ./budna-mcp.tgz
          test "$(npm exec --prefix "$RUNNER_TEMP/npm-smoke" --no -- budna-mcp --version)" = "budna-mcp ${RELEASE_TAG#v}"
      - uses: JS-DevTools/npm-publish@0fd2f4369c5d6bcfcde6091a7c527d810b9b5c3f
        with:
          package: budna-mcp.tgz
          access: public
          provenance: true
          strategy: upgrade

  registry:
    needs: npm
    environment: registry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8
        with:
          repo: modelcontextprotocol/registry
          tag: v1.8.6
          asset-name: mcp-publisher
          platform: linux_amd64
          digest: 1fbe93fc0783c2394d8012c8d6e50a59e98cb2cc2d216264cc69f405d0e21340
      - run: mcp-publisher validate
      - run: mcp-publisher login github-oidc
      - run: mcp-publisher publish
