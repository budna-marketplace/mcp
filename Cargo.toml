[workspace]
members = [
    "crates/budna-mcp",
    "crates/budna-mcp-client",
    "crates/budna-mcp-core",
    "crates/budna-mcp-server",
]
resolver = "3"

[workspace.package]
authors = ["Marcus Cvjeticanin <mjovanc@icloud.com>"]
version = "0.3.3"
edition = "2024"
description = "Budna marketplace and account integration for MCP clients"
license = "MIT"
readme = "README.md"
repository = "https://github.com/budna-marketplace/mcp"
homepage = "https://github.com/budna-marketplace/mcp"
keywords = ["budna", "mcp", "marketplace", "ai", "agent"]
categories = ["api-bindings", "command-line-utilities"]
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unwrap_used = "deny"

[workspace.dependencies]
anyhow = "1"
axum = "0.8"
budna-mcp-client = { version = "0.3.3", path = "crates/budna-mcp-client" }
budna-mcp-core = { version = "0.3.3", path = "crates/budna-mcp-core" }
budna-mcp-server = { version = "0.3.3", path = "crates/budna-mcp-server" }
clap = { version = "4", features = ["derive", "env"] }
http = "1"
httpdate = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls"] }
rmcp = { version = "2.2", features = ["macros", "server", "transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
wiremock = "0.6"
zeroize = "1"

[workspace.metadata.dist]
cargo-dist-version = "0.33.0"
ci = []
hosting = ["github"]
installers = ["npm", "shell", "powershell"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
npm-scope = "@budna-marketplace"
npm-package = "mcp"
source-tarball = false
checksum = "sha256"
include = ["crates/budna-mcp-server/assets/THIRD_PARTY_NOTICES.txt"]

[profile.dist]
inherits = "release"
lto = "thin"
strip = "symbols"
